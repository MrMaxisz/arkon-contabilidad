appId: sv.arkon.contabilidad
productName: ARKON Contabilidad
directories:
  output: paquete
files:
  - dist/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3
npmRebuild: false
# npmRebuild=false: el ABI se fija con scripts/rebuild-electron.mjs + probe ANTES de empaquetar;
# electron-builder NO debe reconstruir contra el ABI de Node y sobrescribir el probe.
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ARKON Contabilidad
